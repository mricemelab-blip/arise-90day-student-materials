<script>
const SECTIONS = [
  {
    id: 's1',
    num: '01',
    title: '科学哲学：波普尔否证主义',
    questions: [
      { id: 's1q1', type: 'textarea', label: '引导问题 1', text: '波普尔认为科学理论的标志是什么？这与逻辑实证主义的可证实性标准有何根本差异？' },
      { id: 's1q2', type: 'textarea', label: '引导问题 2', text: '用否定后件式（modus tollens）的形式，重构"如果一个训练方案有效，客户应在4周内力量提高5-8%"这一预测的否证逻辑。' },
      { id: 's1q3', type: 'textarea', label: '引导问题 3', text: '一位教练说"我的方案对所有人都有效，没进步只是还在适应期"。从波普尔的视角分析，这个方案为什么不具备科学性？' }
    ],
    knowledge: `<p><strong>波普尔的否证主义</strong>（falsificationism）是对归纳主义困境的直接回应。归纳主义面临四重困境：观察不中立、归纳跳跃不保真、条件变化判断形成循环依赖、归纳原则本身不可辩护。波普尔的出发点是：<em>归纳问题在逻辑上不可解决</em>，但单一反例可以在逻辑上否定一个普遍定律——这使用了经典逻辑中的否定后件式（modus tollens）。</p>
<p>波普尔的<em>划界标准</em>（demarcation criterion）：一个理论是否具有科学地位，取决于它是否可以被经验否证（falsifiable）。这一标准逆转了逻辑实证主义的可证实性原则。科学理论的标志不在于它可以被证实，而在于它可以被否证。这一逆转基于深层的逻辑不对称性（logical asymmetry）：全称命题不可被有限观察证实，但可以被单一观察否证。</p>
<p><strong>可否证性的精确含义：</strong>一个理论是可否证的，当且仅当它在逻辑上允许存在某种可能的观察能够否定它。两个关键限定：①"逻辑上可能"而非"实际上已经"——可否证性是关于逻辑空间的判断；②"否定"指逻辑矛盾，而非模糊的"不一致"。</p>
<p><strong>否证的逻辑结构：</strong>T∧A∧I→P（理论+辅助假说+初始条件→预测）。观察到非P，则T∧A∧I整体被否定。这里出现了杜恒-奎因论题（Duhem-Quine thesis）：否证否定的是前件整体，科学家可以选择修改辅助假说来保全核心理论。波普尔的态度是方法论的：科学规范要求科学家认真对待否证，而非用特设性假说（ad hoc hypothesis）逃避。</p>
<p><strong>大胆猜测与保守理论：</strong>理论的内容越丰富，预测越精确，可否证度越高。爱因斯坦广义相对论预测光线偏折1.75弧秒（vs 牛顿力学0.87弧秒），是精确且冒险预测的典范。</p>
<p><strong>科学进步路径：</strong>问题（P1）→ 试探性理论（TT）→ 否证尝试（EE）→ 新问题（P2）。科学通过消除错误来进步，不是通过归纳积累。</p>`,
    summary: '波普尔的否证主义主张：科学理论的标志在于它可以被经验否证。科学通过"大胆猜测→严格检验→消除错误"推进，而非通过归纳积累证实。教练的训练方案必须设定明确的否证标准，否则不具备科学性。'
  },
  {
    id: 's2',
    num: '02',
    title: '哲学：赫拉克利特万物皆流',
    questions: [
      { id: 's2q1', type: 'textarea', label: '引导问题 1', text: '"人不能两次踏入同一条河流"——这一命题除了"河水在变"之外，还有什么更深层的哲学含义？变化是否也作用于主体？' },
      { id: 's2q2', type: 'textarea', label: '引导问题 2', text: '赫拉克利特的"逻各斯"（logos）是什么？如果万物皆流，变化的秩序从何而来？用火作为本原与泰勒斯用水作为本原有何根本差异？' },
      { id: 's2q3', type: 'textarea', label: '引导问题 3', text: '用赫拉克利特的"万物皆流+逻各斯"框架分析运动训练中的周期化（periodization）。训练计划中的"流"是什么？"秩序"是什么？' }
    ],
    knowledge: `<p><strong>赫拉克利特</strong>（Heraclitus of Ephesus, 约前535-前475）从根本上质疑了前苏格拉底哲学在变化背后寻找不变基质（substrate）的传统。他的核心主张：<em>变化本身才是存在的根本特征</em>，不存在变化背后的不变基质。</p>
<p><strong>万物皆流</strong>（panta rhei）：一切事物都处于持续变化之中。"人不能两次踏入同一条河流"（Fragment B91）的深层含义：当你第二次踏入河流时，不仅河水已经不同，踏入河流的"你"也已经不同。<em>变化不仅作用于对象，也作用于主体</em>。"同一条河流"和"同一个人"是语言构造的幻象——语言用名词固定了对象，制造了同一性的错觉。</p>
<p><strong>逻各斯</strong>（logos）：统摄万物变化的理性秩序。它同时包含话语、理性、比例、规律、尺度等多重含义。万物虽然在流变，但流变遵循内在的比例和尺度，不是任意的混乱。</p>
<p><strong>火作为本原</strong>：不是泰勒斯意义上作为基质的物质，而是一个<em>过程性的隐喻</em>。火永远在燃烧和熄灭，永远在变化，但火的燃烧遵循"尺度"。"在一定的分寸上燃烧，在一定的分寸上熄灭"（Fragment B30）。这一选择标志着从物质（substance）到过程（process）的哲学思维转变，与怀特海的过程哲学（process philosophy）和量子场论中粒子作为量子场激发态的当代理解形成深层共鸣。</p>
<p><strong>对立统一</strong>（unity of opposites）：对立面相互依存、相互转化。"生与死、醒与梦、少与老，前者变化了就成为后者，后者变化了就成为前者"（Fragment B88）。</p>`,
    summary: '赫拉克利特的核心洞见：万物皆流（变化是存在的根本特征），但变化遵循逻各斯（内在秩序与尺度）。火作为过程而非物质的本原，标志着哲学思维从实体到过程的转变。训练状态持续流变，但周期化理论为训练变化提供了内在尺度和秩序。'
  },
  {
    id: 's3',
    num: '03',
    title: '营养学：碳水化合物消化吸收',
    questions: [
      { id: 's3q1', type: 'textarea', label: '引导问题 1', text: '碳水化合物从口腔到小肠经历了哪些消化阶段？每个阶段的关键酶和作用底物是什么？' },
      { id: 's3q2', type: 'textarea', label: '引导问题 2', text: '葡萄糖、半乳糖和果糖分别通过什么转运体被小肠上皮细胞吸收？为什么果糖的吸收速率低于葡萄糖？' },
      { id: 's3q3', type: 'textarea', label: '引导问题 3', text: '训练后为什么推荐葡萄糖-果糖混合摄入而非单纯葡萄糖？从SGLT1和GLUT5双通道机制解释。' }
    ],
    knowledge: `<p><strong>消化起点——口腔：</strong>同时发生机械消化（咀嚼增大表面积）和化学消化。唾液腺分泌<em>唾液淀粉酶</em>（salivary amylase, α-淀粉酶），水解淀粉中的α-1,4糖苷键。它是一种内切酶（endoenzyme），从淀粉分子内部随机切断。作用于直链淀粉产生麦芽糖和麦芽三糖；作用于支链淀粉还产生含α-1,6分支点的α-极限糊精。唾液淀粉酶最适pH约6.8，食团进入胃后胃酸pH 1.5-3.5使其变性失活。</p>
<p><strong>胃中的消化中断：</strong>胃液含盐酸和胃蛋白酶，对碳水化合物无消化作用。但食团内部微环境可能仍维持接近中性pH，唾液淀粉酶在核心区域可维持一定活性（"胃内淀粉酶延续消化"效应）。</p>
<p><strong>小肠胰淀粉酶消化：</strong>胰腺分泌胰液含<em>胰淀粉酶</em>（pancreatic amylase），机制相似但效率远高于唾液淀粉酶。十二指肠碱性环境（pH 7.5-8.0）提供适宜条件。终产物：麦芽糖、麦芽三糖和α-极限糊精。胰淀粉酶不能水解α-1,6糖苷键。</p>
<p><strong>刷状缘酶终末水解：</strong>四种膜结合酶完成最后步骤：<em>麦芽糖酶</em>（水解麦芽糖→2葡萄糖）、<em>蔗糖酶</em>（水解蔗糖→葡萄糖+果糖）、<em>乳糖酶</em>（水解乳糖→葡萄糖+半乳糖）、<em>α-糊精酶/异麦芽糖酶</em>（唯一能水解α-1,6糖苷键的人体消化酶）。</p>
<p><strong>单糖吸收机制：</strong>葡萄糖和半乳糖通过<em>SGLT1</em>（钠-葡萄糖协同转运蛋白1）进行继发性主动转运——利用Na⁺梯度中储存的势能，间接消耗ATP。果糖通过<em>GLUT5</em>进行易化扩散——顺浓度梯度，不消耗能量。三种单糖最终通过基底侧膜上的<em>GLUT2</em>进入门静脉血液。吸收速率：葡萄糖 > 半乳糖 > 果糖。</p>
<p><strong>乳糖不耐受：</strong>LCT基因上游MCM6区域的SNP（如-13910C>T）与乳糖酶持续性相关。北欧人群持续性频率80-90%，东亚人群非持续性频率80-90%以上——人类基因-文化协同进化的典型案例。</p>`,
    summary: '碳水化合物消化是多级处理系统：口腔（唾液淀粉酶初步水解α-1,4键）→ 胃（消化基本暂停）→ 小肠（胰淀粉酶继续水解）→ 刷状缘（四种终末酶完成全部水解）。三种单糖通过不同转运体吸收：SGLT1（葡萄糖/半乳糖，继发性主动转运）、GLUT5（果糖，易化扩散）。训练后葡萄糖-果糖混合摄入可利用双通道提高总碳水吸收率。'
  },
  {
    id: 's4',
    num: '04',
    title: '生物力学：关节接触面积与压强',
    questions: [
      { id: 's4q1', type: 'textarea', label: '引导问题 1', text: '压强公式P=F/A对关节力学意味着什么？在力恒定的条件下，接触面积的变化如何影响关节软骨承受的应力？' },
      { id: 's4q2', type: 'textarea', label: '引导问题 2', text: '关节的实际接触面积为什么远小于解剖面积？负荷增加时接触面积如何增大？半月板在其中扮演什么角色？' },
      { id: 's4q3', type: 'textarea', label: '引导问题 3', text: '膝关节外翻（valgus）为什么比静态内翻/外翻对位不良更危险？从接触面积变化速率、伴随的胫骨旋转和神经肌肉控制三个角度分析。' }
    ],
    knowledge: `<p><strong>压强基本定义：</strong>P = F/A。在生物力学中常用兆帕（MPa）。核心推论：在力恒定的条件下，面积越小压强越大，面积越大压强越小。关节软骨所承受的机械应力不仅取决于通过关节的力的大小，还取决于力在多大的面积上分布。</p>
<p><strong>实际接触面积：</strong>关节面的解剖面积并非受力时的实际接触面积。关节面不是完全吻合的（perfectly congruent），在低负荷下实际接触面积可能仅为解剖面积的10-30%。随负荷增加接触面积增大，机制包括：①关节软骨在压力下发生形变（粘弹性性质）；②半月板填充不完全吻合间隙，将点/线接触扩展为面接触，可使膝关节接触面积增加约2-3倍。</p>
<p><strong>关节软骨双相力学模型：</strong>软骨ECM含II型胶原纤维（抗张强度）、蛋白多糖（抗压刚度，带负电荷吸引Na⁺产生渗透压）和水（65-80%湿重）。蛋白多糖的负电荷使软骨维持"预应力"状态。Mow等人（1980）提出的<em>双相力学模型</em>（biphasic model）：稳态负荷下应力由固体基质和流体压力共同承担。</p>
<p><strong>关节对位不良的影响：</strong>对位良好时接触面积最大化、应力分布均匀。内翻（varus）对位不良→负荷向内侧偏移→内侧软骨压强可达正常值2-3倍→加速内侧室骨关节炎。外翻（valgus）产生相反但机制相同的效应。</p>
<p><strong>动态外翻的特殊风险：</strong>①快速运动中外翻在毫秒级出现，软骨来不及通过形变扩大接触面积，瞬时应力集中程度远高于静态；②外翻通常伴随胫骨内旋，联合使ACL承受负荷显著增大；③反映神经肌肉控制缺陷（臀中肌/臀大肌外展-外旋功能不足）。</p>`,
    summary: '关节安全的核心变量不是力的大小，而是力在面积上的分布（P=F/A）。接触面积是动态的，随负荷增加而增大（软骨形变+半月板扩展）。维持关节对位=最大化接触面积=维持压强在安全范围内。膝关节动态外翻因接触面积变化速率不足、伴随胫骨内旋和神经肌肉控制缺陷而特别危险。'
  },
  {
    id: 's5',
    num: '05',
    title: '解剖：肩关节复合体',
    questions: [
      { id: 's5q1', type: 'textarea', label: '引导问题 1', text: '肩关节复合体由哪四个关节组成？为什么说盂肱关节是全身活动度最大但最不稳定的关节？从骨性结构的角度解释。' },
      { id: 's5q2', type: 'textarea', label: '引导问题 2', text: '肩袖四块肌肉分别是什么？它们的核心功能除了产生旋转力矩之外，更重要的是什么？从"压缩-中心化"（compression-centering）机制解释。' },
      { id: 's5q3', type: 'textarea', label: '引导问题 3', text: '肩峰下撞击综合征（SAIS）的功能性因素有哪些？从肩袖功能、肩胛骨运动和盂肱节律三个角度分析撞击发生的因果链。' }
    ],
    knowledge: `<p><strong>四个关节：</strong>①<em>盂肱关节</em>（glenohumeral joint）：球窝关节，三个旋转自由度，活动度最大；②<em>肩锁关节</em>（AC joint）：平面关节，肩胛骨相对于锁骨滑动；③<em>胸锁关节</em>（SC joint）：鞍状关节，上肢与躯干的唯一真正关节连接；④<em>肩胛胸壁关节</em>：非真正滑膜关节，肩胛骨通过肌肉层贴附胸壁。四关节协同运动的协调称为<em>肩肱节律</em>（scapulohumeral rhythm）。</p>
<p><strong>盂肱关节的稳定性困境：</strong>关节盂面积仅为肱骨头约1/3。盂唇（glenoid labrum）使有效深度增加约50%，但骨性稳定性贡献仍极为有限。全身活动度最大=骨性约束最小=最依赖软组织稳定。</p>
<p><strong>三层稳定结构：</strong>①骨性结构（贡献最小）；②被动稳定结构——韧带和盂唇（SGHL限制下方平移，MGHL在外展45°限制前方平移，<em>IGHL</em>在外展90°外旋位是最重要的前方稳定结构，称"前下方悬带"）；③主动稳定结构——肌肉和肩袖（最重要）。</p>
<p><strong>肩袖四肌：</strong>冈上肌（外展启动0-15°最关键）、冈下肌（外旋）、小圆肌（协助外旋）、肩胛下肌（内旋，体积最大）。核心功能：<em>压缩-中心化</em>（compression-centering）——四块肌肉协同收缩将肱骨头压入并保持在关节盂中心，抵消三角肌收缩时产生的向上/前方剪切分量。</p>
<p><strong>肩峰下撞击机制：</strong>功能性因素更普遍——①肩袖功能不足→肱骨头向上平移→挤压肩峰下间隙；②肩胛骨上回旋不足→关节盂朝向不够朝上→肱骨头更早接近肩峰；③肩胛骨后倾不足→肩峰位置相对更低→间隙进一步压缩。骨性因素如III型钩状肩峰（Bigliani 1972分型）也参与。</p>`,
    summary: '肩关节复合体由四个关节协同实现上肢最大活动度，代价是极低的骨性稳定性。肩袖的核心功能是"压缩-中心化"——将肱骨头保持在关节盂中心，为三角肌提供稳定工作平台。肩胛骨稳定性是安全过头推举的前提。忽视肩袖训练=忽视肩关节最基本的安全机制。'
  }
];

const STORAGE_PREFIX = 'l9_handbook_';
let submitted = false;

function init() {
  // Build nav
  const nav = document.getElementById('navTabs');
  nav.innerHTML = SECTIONS.map((s, i) =>
    `<button class="nav-tab" onclick="scrollToSection('${s.id}')" id="nav_${s.id}">${s.num} ${s.title.split('：')[0]}</button>`
  ).join('');

  // Build sections
  const main = document.getElementById('mainContent');
  main.innerHTML = SECTIONS.map(s => buildSection(s)).join('');

  // Load saved
  loadAll();
  updateProgress();
}

function buildSection(s) {
  let html = `<section class="section" id="${s.id}">`;
  html += `<div class="section-header"><div class="section-badge"></div><div><div class="section-num">SECTION ${s.num}</div><div class="section-title">${s.title}</div></div></div>`;

  // Questions
  html += `<div class="card">`;
  s.questions.forEach(q => {
    html += `<div class="q-block">`;
    html += `<div class="q-label">${q.label}</div>`;
    html += `<div class="q-text">${q.text}</div>`;
    html += `<textarea class="q-textarea" id="${q.id}" placeholder="在此输入你的思考..." oninput="saveAnswer('${q.id}')"></textarea>`;
    html += `<div class="ref-answer" id="ref_${q.id}"><div class="ref-label">参考答案</div><div class="ref-text" id="reft_${q.id}"></div></div>`;
    html += `</div>`;
  });
  html += `</div>`;

  // Knowledge
  html += `<div class="knowledge"><div class="knowledge-header"><div class="knowledge-icon">知</div><div class="knowledge-title">知识点详解</div></div>`;
  html += `<div class="card"><div class="knowledge-content">${s.knowledge}</div></div></div>`;

  // Summary
  html += `<div class="summary-box"><div class="summary-label">核心结论</div><div class="summary-text">${s.summary}</div></div>`;

  html += `</section>`;
  return html;
}

function scrollToSection(id) {
  document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function saveAnswer(qid) {
  const val = document.getElementById(qid).value;
  localStorage.setItem(STORAGE_PREFIX + qid, val);
  updateProgress();
}

function loadAll() {
  SECTIONS.forEach(s => {
    s.questions.forEach(q => {
      const saved = localStorage.getItem(STORAGE_PREFIX + q.id);
      if (saved) document.getElementById(q.id).value = saved;
    });
  });
}

function countFilled() {
  let count = 0;
  SECTIONS.forEach(s => {
    const filled = s.questions.some(q => {
      const el = document.getElementById(q.id);
      return el && el.value.trim().length > 0;
    });
    if (filled) count++;
  });
  return count;
}

function updateProgress() {
  const filled = countFilled();
  const pct = (filled / SECTIONS.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = filled + '/' + SECTIONS.length;
}

  s5q1: `四个关节：盂肱关节（球窝，活动度最大）、肩锁关节（平面）、胸锁关节（鞍状，上肢与躯干唯一真正关节连接）、肩胛胸壁关节（非真正滑膜关节）。盂肱关节最不稳定的原因：关节盂面积仅为肱骨头约1/3，即使盂唇增加深度50%，骨性约束仍极为有限。全身活动度最大=骨性约束最小=最依赖软组织稳定。`,

function submitAll() {
  if (submitted) return;
  submitted = true;
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = '已提交';

  // Show reference answers
  SECTIONS.forEach(s => {
    s.questions.forEach(q => {
      const refEl = document.getElementById('ref_' + q.id);
      const refText = document.getElementById('reft_' + q.id);
      if (REF_ANSWERS[q.id]) {
        refText.textContent = REF_ANSWERS[q.id];
        refEl.classList.add('visible');
      }
    });
  });

  // Save submission state
  localStorage.setItem(STORAGE_PREFIX + 'submitted', 'true');
}

// Restore submitted state on reload
window.addEventListener('DOMContentLoaded', () => {
  init();
  if (localStorage.getItem(STORAGE_PREFIX + 'submitted') === 'true') {
    submitAll();
  }
});

// Intersection observer for nav highlight
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      const nav = document.getElementById('nav_' + e.target.id);
      if (nav) nav.classList.add('active');
    }
  });
}, { threshold: 0.3 });

setTimeout(() => {
  SECTIONS.forEach(s => {
    const el = document.getElementById(s.id);
    if (el) observer.observe(el);
  });
}, 100);
</script>
